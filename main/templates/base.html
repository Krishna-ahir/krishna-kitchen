{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Krishna's Kitchen</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display&family=Raleway&display=swap" rel="stylesheet">

    <!--<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

<!-- Navbar -->
<header>
    <div class="logo">KRISHNA'S KITCHEN <span>LOCAL GOURMET</span></div>

    <nav class="navbar navbar-expand-lg navbar-dark fixed-top" style="background:#4b2e2e;">
    <div class="container">

        <a class="navbar-brand fw-bold" href="/">
            KRISHNA'S KITCHEN
        </a>

        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav">

            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="/">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/menu">Menu</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/about">About</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/contact">Contact</a>
                </li>

                <li class="nav-item">
                    <a class="btn btn-warning ms-lg-3 mt-2 mt-lg-0"
                       href="/booking">
                        Book Table
                    </a>
                </li>

            </ul>

        </div>

    </div>
</nav>
</header>

<!-- Content -->
<div class="pt-5 mt-4">
    {% block content %}{% endblock %}
</div>

<!-- Footer -->
<footer class="footer text-center p-3 mt-5">
    <p>© 2026 Krishna's Kitchen</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
